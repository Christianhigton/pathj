---
name: pathj
title: Path Analysis
menuGroup: SEM
version: '0.0.1'
jas: '1.2'
export: false
completeWhenFilled: false
description:
    main: Path Analysis
    R:
        dontrun: true
formula:
   endogenous: 
     custom: true
   endogenousTerms: 
     custom: true
   factors: 
     custom: true
   covs: 
     custom: true

   
options:
    - name: data
      type: Data
      description:
          R: the data as a data frame


    - name: endogenous
      title: Endogenous Variables
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default:
      description:
          R: a vector of strings naming the mediators from `data`

    - name: factors
      title: Exogenous Factors
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default:
      description:
          R: a vector of strings naming the fixed factors from `data`

    - name: covs
      title: Exogenous Covariates
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default:
      description:
          R: a vector of strings naming the covariates from `data`

    - name: multigroup
      title: Multigroup Analysis Factor
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default:
      description:
          R: factor defining groups for multigroup analysis

    - name: clusterVariable
      title: Cluster / ID variable
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default:
      description:
          R: >
             Optional cluster or participant identifier for multilevel
             diagnostics, ICC screening, and within-/between-person
             interpretation.

    - name: withinVariables
      title: Within-person variables
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default:
      description:
          R: >
             Variables interpreted at the within-person or level-1 occasion
             level when a cluster variable is supplied.

    - name: betweenVariables
      title: Between-person variables
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default:
      description:
          R: >
             Variables interpreted at the between-person or level-2 cluster
             level when a cluster variable is supplied.


    - name: tests
      type: NMXList
      options:
          - name:  Satorra.Bentler
            title: Satorra-Bentler
          - name:  Yuan.Bentler
            title: Yuan Bentler
          - name:  Satterthwaite
            title: Satterthwaite
      default:


    - name: modindices
      title: Modification Indices
      type: Bool
      default: false
      description:
          R: >
            TRUE or FALSE (default). When TRUE, compute and display lavaan modification indices.

    - name: miMin
      title: Minimum MI
      type: Number
      default: 4
      min: 0
      description:
          R: >
            Minimum modification index threshold for inclusion in the table.


    - name: se
      title: Standard errors
      type: List
      options:
        - name: standard
          title: Standard
        - name: robust.sem
          title: Robust (Conventional)
        - name: robust.huber.white
          title: Robust (Huber-White)
        - name: boot
          title: Bootstrap
      default: standard

    - name: r2ci
      title: R-squared C.I
      type: List
      options:
        - name: fisher
          title: Z-to-r transform
        - name: model
          title: Residual C.I. 

      default: fisher
      description:
          R: >
             Choose the confidence interval type

    - name: r2test
      title: R-squared tests
      type: Bool
      default: false


    - name: bootci
      title: Bootstrap C.I
      type: List
      options:
        - name: perc
          title: Percentiles
        - name: bca.simple
          title: Adjusted bias corrected
        - name: norm
          title: Normal
        - name: basic
          title: Basic
          
      default: perc
      description:
          R: >
             Choose the confidence interval type

    - name: ci
      title: Show
      type: Bool
      default: true


    - name: ciWidth
      title: Confidence level
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: >
            a number between 50 and 99.9 (default: 95) specifying the confidence
            interval width for the parameter estimates

    - name: bootN
      title: Bootstrap Rep.
      type: Number
      min: 50
      default: 1000
      description:
          R: >
            number of bootstrap samples for estimating confidence intervals

    - name: showintercepts
      title: Show intercepts estimates
      type: Bool
      default: true
      description:
          R: >
            `TRUE` or `FALSE` (default), show intercepts
    - name: intercepts
      title: Estimates intercepts
      type: Bool
      default: true
      description:
          R: >
            `TRUE` or `FALSE` (default), show intercepts

    - name: indirect
      title: Indirect Effects
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), show intercepts

    - name: contrasts
      title: Factors Coding
      type: Array
      items: (factors)
      default: 
      template:
          type: Group
          elements:
              - name: var
                type: Variable
                content: $key
              - name: type
                type: List
                options:
                  - simple
                  - deviation
                  - dummy
                  - difference
                  - helmert
                  - repeated
                  - polynomial
                default: simple
      description:
          R: >
            a list of lists specifying the factor and type of contrast to use,
            one of `'deviation'`, `'simple'`, `'difference'`, `'helmert'`,
            `'repeated'` or `'polynomial'`



    - name: showContrastCode
      title: Contrast Coefficients tables
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide contrast coefficients tables



    - name: scaling
      title: Continuous Variables Scaling
      type: Array
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
                content: $key
              - name: type
                type: List
                options:
                    - title: None
                      name: 'none'
                    - title: Centered
                      name:  centered
                    - title: z-scores
                      name: standardized
                    - title: Log
                      name: 'log'

                default: none 
      description:
          R: >
             a named vector of the form \code{c(var1='type', var2='type2')} specifying the transformation to apply to covariates,
             one of `'centered'` to the mean, `'standardized'`,`'log'` or  `'none'`. `'none'` leaves the variable as it is.
          ui: >
             define the transformation to apply to covariates,
             one of `'Centered'` to the mean, `'z-scores'` for standardized,`'log'` for natural logarithm,  or  `'None'`. `'None'` leaves the variable as it is.

######### specs here ##########

          
    - name: endogenousTerms
      title: Models for Endogenous Vars 
      type: Array
      default: [[]]
      template:
          type: Terms
      description:
          R: >
            a list of lists specifying the models for with the mediators as dependent variables.          

##### diagram ####

    - name: diagram
      title: Path Diagram
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), produce a path diagram

    # P-value graphs across sample sizes
    - name: pgraphs
      title: Show p-value graphs
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default). When TRUE, fits the model on
            varying sample sizes and draws p-value vs sample-size lines for
            each predictor.

    - name: pcurve_target
      title: P-curve focus
      type: List
      options:
        - name: all
          title: All available effects
        - name: direct
          title: Direct paths
        - name: mediation
          title: Mediation / indirect effects
        - name: moderation
          title: Moderation / interaction paths
        - name: multigroup
          title: Multigroup paths
        - name: multilevel
          title: Multilevel variables
      default: all
      description:
          R: >
            Select which family of effects is screened in p-curve summaries
            and p-value graphs. Mediation uses defined indirect effects when
            available; moderation uses interaction paths; multilevel screens
            paths involving selected within- or between-person variables.

    - name: pcurve_sizes
      title: Sample sizes
      type: String
      default: '50, 100, 200, 500'
      description:
          R: >
            Comma-separated sample sizes to project to (e.g., '50,100,200,500').

    - name: pcurve_linetype
      title: Line type
      type: List
      options:
        - name: solid
          title: Solid
        - name: dashed
          title: Dashed
        - name: dotted
          title: Dotted
      default: solid

    - name: pcurve_lwd
      title: Line width
      type: Number
      default: 1.2
      min: 0.2
      max: 5

    - name: pcurve_palette
      title: Palette
      type: List
      options:
        - name: default
          title: Default
        - name: okabeito
          title: Colorblind (Okabe-Ito)
      default: default

    - name: pcurve_ribbons
      title: Show 95% CI ribbons
      type: Bool
      default: true

    - name: diag_paths
      title: Paths Labels
      type: List
      options:
        - name:  est
          title: Coefficients
        - name: stand
          title: Betas
        - name: name
          title: Labels
        - name: hide
          title: None
      default: est
      description:
          R: >
             Choose the diagram labels

    - name: diag_sigstars
      title: Significance stars
      type: Bool
      default: false
      description:
          R: >
            TRUE or FALSE (default). When TRUE, append significance stars to
            path diagram labels for regression paths: * p < .05, ** p < .01,
            *** p < .001.

    - name: diag_resid
      title: Residuals
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), produce a path diagram

    - name: diag_offset_labs
      title: Offset labels
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), offset labels position

    - name: diag_labsize
      title: Node Size
      type: List
      options:
        - name:  small
          title: Small
        - name: medium
          title: Medium
        - name: large
          title: Large
        - name: vlarge
          title: Very Large

      default: medium
      description:
          R: >
             Choose the diagram labels

    - name: diag_rotate
      title: Rotate
      type: List
      options:
        - name:  "1"
          title: Exog. top
        - name: "2"
          title: Exog. left
        - name: "3"
          title: Exog. bottom
        - name: "4"
          title: Exog. right

      default: "2"
      description:
          R: >
             Choose the diagram labels
    - name: diag_type
      title: Type
      type: List
      options:
        - name:  "mediation"
          title: Mediation-like
        - name:  "tree"
          title: Tree-like
        - name:  "tree2"
          title: Tree-like alt.
        - name: "circle"
          title: Circle
        - name: "circle2"
          title: Circle alt.
        - name: "spring"
          title: Spring

      default: "mediation"
      description:
          R: >
             Choose the diagram labels

    - name: diag_shape
      title: Shapes
      type: List
      options:
        - name:  "rectangle"
          title:  Rectangles
        - name:  "square"
          title:  Squares
        - name: "circle"
          title: Circles
        - name: "ellipse"
          title: Ellipses
        - name: "diamond"
          title: Diamonds

      default: "rectangle"
      description:
          R: >
             Choose the diagram labels


    - name: diag_abbrev
      title: Abbreviate
      type: List
      options:
        - name:  "0"
          title:  No abbrev.
        - name:  "5"
          title:  "5"
        - name:  "10"
          title:  "10"
        - name:  "15"
          title:  "15"
        - name:  "20"
          title:  "20"
        - name:  "25"
          title:  "25"
      default: "0"
      description:
          R: >
             Choose the diagram labels


### end diagram ###

#### variances and covariances ###

    - name: varcov
      title: Select pairs
      type: Pairs
      description:
          R: >
            a list of lists specifying the  covariances that
            need to be estimated
            
    - name: cov_y
      title: Endogenous Correlations
      type: Bool
      default: true
      description:
          R: >
            `TRUE` or `FALSE` (default), produce a path diagram
    - name: cov_x
      title: Fixed Exogenous
      type: Bool
      default: true
      description:
          R: >
            `TRUE` or `FALSE` (default), produce a path diagram


    - name: constraints
      title: Insert contraints or defined parameters
      type: Array
      default: []
      template:
          type: String
      description:
          R: >
            a list of lists specifying the models random effects.          

    - name: constraints_examples
      type: Bool
      title: Show Examples
      default: false

    - name: showlabels
      type: Bool
      title: Show parameters labels
      default: false

    - name: scoretest
      type: Bool
      title: Univariate
      default: true
    - name: cumscoretest
      type: Bool
      title: Cumulative
      default: false

    - name: estimator
      title: Method
      type: List
      options:
        - name:  ML
          title: Maximum Likelihood
        - name: GLS 
          title: Generalized least squares
        - name: WLS 
          title: Weighted LS
        - name: DWLS
          title: Diagonally weighted LS
        - name: WLSMV
          title: Robust weighted LS (WLSMV)
        - name: ULS
          title: Unweighted LS
          
      default: ML
      description:
          R: >
             Choose the diagram labels

    - name: likelihood
      title: ML likelihood approach
      type: List
      options:
        - name: normal 
          title: Normal
        - name:  wishart
          title: Wishart
          
      default: normal
      description:
          R: >
             Choose the diagram labels

    - name: missing
      title: Missing Data
      type: List
      options:
        - name: fiml
          title: Full Information Maximum Likelihood (FIML)
        - name: mi
          title: Multiple Imputation (MI)
        - name: listwise
          title: Listwise Deletion
        - name: pairwise
          title: Pairwise Deletion
      default: fiml
      description:
          R: >
             Missing-data handling method. FIML uses all available data under
             ML estimation, MI pools estimates across imputed datasets,
             listwise deletion removes incomplete cases, and pairwise deletion
             uses pairwise covariance information with a cautionary warning.
          ui: >
             FIML is the recommended default for ML models under MAR.
             Multiple imputation uses mice and pools estimates. Listwise
             deletion removes incomplete rows. Pairwise deletion is available
             for teaching and should be used cautiously.

    - name: miN
      title: Imputations
      type: Number
      default: 5
      min: 2
      max: 100
      description:
          R: >
             Number of imputed datasets to generate when Multiple Imputation is
             selected.

    - name: miSeed
      title: MI seed
      type: Number
      default: 12345
      min: 1
      description:
          R: >
             Random seed used by mice so multiple-imputation results are
             reproducible.

    - name: miStrategy
      title: MI group strategy
      type: List
      options:
        - name: include_group
          title: Include group as predictor
        - name: within_group
          title: Impute within groups
      default: include_group
      description:
          R: >
             Strategy for multigroup multiple imputation. Include group as
             predictor runs one imputation model with the grouping variable
             retained as a predictor but not imputed. Impute within groups runs
             separate imputations within each group and recombines the completed
             datasets.
          ui: >
             For multigroup MI, include the group as a predictor for a single
             imputation model, or impute separately within each group when group
             distributions should be preserved.

    - name: showMissingDiagnostics
      title: Show missing data diagnostics
      type: Bool
      default: false
      description:
          R: >
             TRUE or FALSE (default). When TRUE, display missing-data patterns
             and a simple MCAR diagnostic when an optional helper package is
             available.

    - name: intelligentReport
      title: Intelligent report
      type: Bool
      default: true
      description:
          R: >
             TRUE or FALSE (default TRUE). When TRUE, produce automatic APA
             reporting, assumption checks, recommendations, model insights,
             mediation/moderation summaries, multigroup comparison tables, and
             model-selection guidance.

    - name: reportLevel
      title: Report level
      type: List
      options:
        - name: basic
          title: Basic
        - name: apa
          title: Standard APA
        - name: advanced
          title: Advanced
      default: apa
      description:
          R: >
             Teaching/reporting mode used for automatic narrative output.
             Advanced mode includes more non-significant paths and more
             diagnostic context.

    - name: autoOrdinal
      title: Auto-detect ordinal/binary variables
      type: Bool
      default: true
      description:
          R: >
             TRUE or FALSE (default TRUE). When TRUE, numeric ordinal-like or
             binary model variables are declared as ordered for lavaan and WLSMV
             is used automatically when an ML-family estimator was selected.

    - name: reportParagraph
      title: Copyable report paragraph
      type: Bool
      default: true
      description:
          R: >
             TRUE or FALSE (default TRUE). When TRUE, show a single copyable
             paragraph version of the automatic report with a caution to review
             the text before using it in a manuscript.

    - name: showSyntax
      title: Show lavaan and Mermaid syntax
      type: Bool
      default: true
      description:
          R: >
             TRUE or FALSE (default TRUE). When TRUE, show copyable lavaan
             model syntax and Mermaid flowchart syntax generated from the
             fitted model.

    - name: showMermaidDiagramSyntax
      title: Mermaid syntax under path diagram
      type: Bool
      default: false
      description:
          R: >
             TRUE or FALSE (default FALSE). When TRUE, show the generated
             Mermaid syntax directly below the path diagram output.

    - name: showPathLegend
      title: Path diagram legend
      type: Bool
      default: true
      description:
          R: >
             TRUE or FALSE (default TRUE). When TRUE, show a compact legend
             below the path diagram explaining coefficient labels and
             significance stars. The legend is outside the image so it does not
             overlap the diagram.

    - name: syntaxSource
      title: Model input
      type: List
      options:
        - name: gui
          title: GUI builder
        - name: lavaan
          title: lavaan syntax
        - name: mermaid
          title: Mermaid syntax
      default: gui
      description:
          R: >
             Choose whether the model is built from the standard jamovi GUI
             controls, pasted lavaan syntax, or pasted Mermaid syntax.

    - name: syntaxVars
      title: Variables used in imported syntax
      type: Variables
      suggested:
        - continuous
        - ordinal
        - nominal
      permitted:
        - numeric
        - factor
      default: null
      description:
          R: >
             Dataset variables referenced by imported lavaan or Mermaid syntax.
             Select these when Model input is lavaan syntax or Mermaid syntax
             so jamovi keeps the required columns for estimation.

    - name: syntaxText
      title: Paste model syntax
      type: String
      hidden: true
      default: ''
      description:
          R: >
             Full lavaan or Mermaid model syntax pasted as one block. This is
             used when Model input is lavaan syntax or Mermaid syntax.

    - name: syntaxApply
      title: Import syntax
      type: Action
      default: false
      description:
          R: >
             TRUE or FALSE (default FALSE). Press this after pasting imported
             lavaan or Mermaid syntax to confirm that the pasted syntax should
             be used for estimation.

    - name: syntaxExampleChoice
      title: Sample syntax
      type: List
      options:
        - name: lavaan
          title: lavaan example
        - name: mermaid
          title: Mermaid example
      default: lavaan
      description:
          R: >
             Choose a sample syntax block to copy or insert into the model
             syntax editor.

    - name: syntaxExampleLavaan
      title: Example lavaan syntax
      type: String
      hidden: true
      default: 'Stress ~ Sleep + Support\nAnxiety ~ Stress + Support\nDepression ~ Stress + Support + Anxiety'
      description:
          R: >
             Copyable example lavaan syntax shown in the options panel.

    - name: syntaxExampleMermaid
      title: Example Mermaid syntax
      type: String
      hidden: true
      default: 'graph LR\nSleep[Sleep Quality] --> Stress[Stress]\nStress --> Anxiety[Anxiety]\nStress --> Depression[Depression]\nSupport[Social Support] --> Anxiety[Anxiety]\nSupport --> Depression[Depression]\nAnxiety --> Depression[Depression]'
      description:
          R: >
             Copyable example Mermaid syntax shown in the options panel.

    - name: syntaxExampleCopy
      title: Copy sample syntax
      type: Action
      default: false
      description:
          R: >
             Copy the selected sample syntax block to the clipboard when
             supported by jamovi.

    - name: syntaxExampleInsert
      title: Insert sample syntax
      type: Action
      default: false
      description:
          R: >
             Insert the selected sample syntax block into the model syntax
             editor.

    - name: group.equal
      type: NMXList
      options:
          - name: intercepts
            title: Intercepts
          - name: residuals
            title: Residual variances
          - name: residual.covariances
            title: Residual covariances
          - name: regressions
            title: regression coefficients
      default:



...

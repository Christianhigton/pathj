---
name:  pathj
title: Path Analysis
jrs: '1.0'


items:

  - name: model
    type: Property
    description: The underlying `lavaan` object


  - name: info
    title: Models Info
    type: Table
    clearWith:
                      - endogenousTerms
                      - constraints

    columns:
       - name: info
         type: text
         title: ""
         combineBelow: true
       - name: value
         type: text
         title: ""
       - name: specs
         type: text
         title: ""
         combineBelow: true
    refs: pathj

  - name: fit
    title: "Overall Tests"
    type: Group
    visible: false
    clearWith:
                  - endogenousTerms
    items:
    
          - name: main
            title: Model Tests
            type: Table
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - ciType
                  - contrasts
                  - cov_y
                  - constraints

            columns:
                    - name: label
                      title: Label
                      type: text
                    - name: chisq
                      title:  X²
                      type: number
                    - name:  df
                      title: "df"
                      type: integer
                    - name: pvalue
                      title: "p"
                      type: number
                      format: zto,pvalue

          - name: constraints
            title: Constraints Score Tests
            type: Table
            visible: false
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - ciType
                  - contrasts
                  - cov_y
                  - constraints

            columns:
                    - name: type
                      type: text
                      title: Type
                      visible: true
                      combineBelow: true
                    - name: lhs
                      title: Par 1
                      type: text
                    - name: op
                      title: ""
                      type: text
                    - name: rhs
                      title: Par 2
                      type: text
                    - name: chisq
                      title:  X²
                      type: number
                    - name:  df
                      title: "df"
                      type: integer
                    - name: pvalue
                      title: "p"
                      type: number
                      format: zto,pvalue

          - name: indices
            title: Fit Indices
            type: Table
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - ciType
                  - contrasts
                  - cov_y
                  - constraints

            columns:

                    - name:  aic
                      title: AIC
                      visible: (estimator:ML)
                      type: number
                    - name:  bic
                      title: BIC
                      type: number
                      visible: (estimator:ML)
                    - name:  bic2
                      title: "adj. BIC"
                      type: number
                      visible: (estimator:ML)
                    - name:  srmr
                      title: SRMR
                      type: number
                      format: zto

                    - name: rmsea
                      title:  RMSEA
                      type: number
                      format: zto
                      
                    - name:  rmsea.ci.lower
                      title: Lower
                      type: number
                      format: zto

                    - name:  rmsea.ci.upper
                      title: Upper
                      type: number
                      format: zto

                    - name: rmsea.pvalue
                      title: 'RMSEA p'
                      type: number
                      format: zto,pvalue

          - name: indices2
            title: Fit Indices
            type: Table
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - ciType
                  - contrasts
                  - cov_y
                  - constraints
            columns:

                    - name:  cfi
                      title: CFI
                      type: number
                      format: zto

                    - name:  tli
                      title: TLI
                      type: number
                      format: zto

                    - name:  rni
                      title: RNI
                      type: number
                      format: zto
                    - name:  gfi
                      title: GFI
                      type: number
                      format: zto
                    - name: agfi
                      title:  "adj. GFI"
                      type: number
                      format: zto
                    - name: pgfi
                      title:  "pars. GFI"
                      type: number
                      format: zto

          - name: miFit
            title: MI Fit by Imputation
            type: Table
            visible: (missing:mi)
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - contrasts
                  - cov_y
                  - constraints
                  - data
                  - multigroup
                  - missing
                  - miN
                  - miSeed
                  - miStrategy
            columns:
                    - name: imputation
                      title: Imputation
                      type: integer
                    - name: chisq
                      title: X²
                      type: number
                    - name: df
                      title: df
                      type: integer
                    - name: pvalue
                      title: p
                      type: number
                      format: zto,pvalue
                    - name: cfi
                      title: CFI
                      type: number
                      format: zto
                    - name: tli
                      title: TLI
                      type: number
                      format: zto
                    - name: rmsea
                      title: RMSEA
                      type: number
                      format: zto
                    - name: srmr
                      title: SRMR
                      type: number
                      format: zto
                    - name: aic
                      title: AIC
                      type: number
                    - name: bic
                      title: BIC
                      type: number

          - name: miPooledFit
            title: Pooled MI Fit
            type: Table
            visible: (missing:mi)
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - contrasts
                  - cov_y
                  - constraints
                  - data
                  - multigroup
                  - missing
                  - miN
                  - miSeed
                  - miStrategy
            columns:
                    - name: method
                      title: Method
                      type: text
                    - name: chisq
                      title: X²
                      type: number
                    - name: df
                      title: df
                      type: number
                    - name: pvalue
                      title: p
                      type: number
                      format: zto,pvalue
                    - name: cfi
                      title: CFI
                      type: number
                      format: zto
                    - name: tli
                      title: TLI
                      type: number
                      format: zto
                    - name: rmsea
                      title: RMSEA
                      type: number
                      format: zto
                    - name: srmr
                      title: SRMR
                      type: number
                      format: zto
                    - name: aic
                      title: AIC
                      type: number
                    - name: bic
                      title: BIC
                      type: number
                    - name: note
                      title: Note
                      type: text

          - name: miFitSummary
            title: MI Fit Summary
            type: Table
            visible: (missing:mi)
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - contrasts
                  - cov_y
                  - constraints
                  - data
                  - multigroup
                  - missing
                  - miN
                  - miSeed
                  - miStrategy
            columns:
                    - name: statistic
                      title: Statistic
                      type: text
                    - name: chisq
                      title: X²
                      type: number
                    - name: df
                      title: df
                      type: number
                    - name: pvalue
                      title: p
                      type: number
                      format: zto,pvalue
                    - name: cfi
                      title: CFI
                      type: number
                      format: zto
                    - name: tli
                      title: TLI
                      type: number
                      format: zto
                    - name: rmsea
                      title: RMSEA
                      type: number
                      format: zto
                    - name: srmr
                      title: SRMR
                      type: number
                      format: zto
                    - name: aic
                      title: AIC
                      type: number
                    - name: bic
                      title: BIC
                      type: number

          - name: miStatus
            title: MI Imputation Status
            type: Table
            visible: (missing:mi)
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - contrasts
                  - cov_y
                  - constraints
                  - data
                  - multigroup
                  - missing
                  - miN
                  - miSeed
                  - miStrategy
            columns:
                    - name: imputation
                      title: Imputation
                      type: integer
                    - name: status
                      title: Status
                      type: text
                    - name: converged
                      title: Converged
                      type: text
                    - name: warning
                      title: Warning
                      type: text
                    - name: error
                      title: Error
                      type: text


  - name: diagnostics
    title: "Model Diagnostics"
    type: Group
    visible: (modindices || showMissingDiagnostics)
    clearWith:
                  - endogenousTerms
    items:
          - name: modindices
            title: Modification Indices
            type: Table
            visible: (modindices)
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - constraints
                  - cov_y
                  - multigroup
                  - modindices
                  - miMin
            columns:
                    - name: lgroup
                      title: Group
                      type: text
                      visible: (multigroup)
                      combineBelow: true
                    - name: lhs
                      title: LHS
                      type: text
                    - name: op
                      title: ""
                      type: text
                    - name: rhs
                      title: RHS
                      type: text
                    - name: mi
                      title: MI
                      type: number
                    - name: epc
                      title: EPC
                      type: number
                    - name: sepc.all
                      title: "SEPC"
                      type: number

          - name: missingSummary
            title: Missing Data Summary
            type: Table
            visible: (showMissingDiagnostics)
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - multigroup
                  - data
                  - missing
                  - showMissingDiagnostics
            columns:
                    - name: variable
                      title: Variable
                      type: text
                    - name: missing
                      title: Missing
                      type: integer
                    - name: percent
                      title: Missing %
                      type: number
                      format: zto

          - name: missingPatterns
            title: Missing Data Patterns
            type: Table
            visible: (showMissingDiagnostics)
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - multigroup
                  - data
                  - missing
                  - showMissingDiagnostics
            columns:
                    - name: pattern
                      title: Pattern
                      type: text
                    - name: n
                      title: N
                      type: integer
                    - name: percent
                      title: "%"
                      type: number
                      format: zto

          - name: mcar
            title: MCAR Diagnostic
            type: Table
            visible: (showMissingDiagnostics)
            clearWith:
                  - endogenous
                  - covs
                  - factors
                  - multigroup
                  - data
                  - missing
                  - showMissingDiagnostics
            columns:
                    - name: test
                      title: Test
                      type: text
                    - name: statistic
                      title: Statistic
                      type: number
                    - name: df
                      title: df
                      type: integer
                    - name: pvalue
                      title: p
                      type: number
                      format: zto,pvalue
                    - name: note
                      title: Note
                      type: text


  - name: intelligent
    title: "Intelligent Report"
    type: Group
    visible: (intelligentReport)
    clearWith:
                  - endogenous
                  - endogenousTerms
                  - covs
                  - factors
                  - contrasts
                  - cov_y
                  - constraints
                  - data
                  - multigroup
                  - missing
                  - miN
                  - miSeed
                  - miStrategy
                  - estimator
                  - autoOrdinal
                  - reportLevel
                  - reportParagraph
                  - showSyntax
    items:
          - name: apaText
            title: Automatic APA Narrative
            type: Table
            columns:
                    - name: section
                      title: Section
                      type: text
                      combineBelow: true
                    - name: text
                      title: Interpretation
                      type: text

          - name: reportParagraph
            title: Copyable Report Paragraph
            type: Html
            visible: (reportParagraph)

          - name: assumptions
            title: Assumption Checks and Recommendations
            type: Table
            columns:
                    - name: check
                      title: Check
                      type: text
                    - name: status_icon
                      title: Status
                      type: text
                    - name: status
                      title: Result
                      type: text
                    - name: explanation
                      title: Explanation
                      type: text
                    - name: recommendation
                      title: Recommendation
                      type: text

          - name: recommendations
            title: Recommended Next Steps
            type: Table
            columns:
                    - name: recommendation
                      title: Recommendation
                      type: text

          - name: variableTypes
            title: Variable Type Detection
            type: Table
            columns:
                    - name: variable
                      title: Variable
                      type: text
                    - name: type
                      title: Type
                      type: text
                    - name: n_unique
                      title: Unique
                      type: integer
                    - name: ordered
                      title: Ordered
                      type: text

          - name: mediationDecomp
            title: Mediation Decomposition
            type: Table
            columns:
                    - name: lgroup
                      title: Group
                      type: text
                      visible: (multigroup)
                    - name: predictor
                      title: Predictor
                      type: text
                    - name: mediator
                      title: Mediator
                      type: text
                    - name: outcome
                      title: Outcome
                      type: text
                    - name: direct
                      title: Direct
                      type: number
                    - name: indirect
                      title: Indirect
                      type: number
                    - name: total
                      title: Total
                      type: number
                    - name: percent_mediated
                      title: "% Mediated"
                      type: number

          - name: groupComparison
            title: Multigroup Path Comparison
            type: Table
            visible: (multigroup)
            columns:
                    - name: path
                      title: Path
                      type: text

                      title: Group 1
                      type: text
                    - name: group_2
                      title: Group 2
                      type: text
                    - name: group_1_beta
                      title: Group 1 β
                      type: number
                    - name: group_2_beta
                      title: Group 2 β
                      type: number
                    - name: difference
                      title: Difference
                      type: number
                    - name: z
                      title: z
                      type: number
                    - name: pvalue
                      title: p
                      type: number
                      format: zto,pvalue
                    - name: significant
                      title: Significant
                      type: text
                    - name: interpretation
                      title: Interpretation
                      type: text

          - name: insights
            title: Model Insights
            type: Table
            columns:
                    - name: insight
                      title: Insight
                      type: text
                    - name: outcome
                      title: Outcome
                      type: text
                    - name: predictor
                      title: Predictor
                      type: text
                    - name: beta
                      title: β
                      type: number
                    - name: effect_size
                      title: Effect Size
                      type: text
                    - name: pvalue
                      title: p
                      type: number
                      format: zto,pvalue

          - name: modelComparison
            title: Model Comparison and Selection
            type: Table
            columns:
                    - name: model
                      title: Model
                      type: text
                    - name: chisq
                      title: X²
                      type: number
                    - name: df
                      title: df
                      type: integer
                    - name: pvalue
                      title: p
                      type: number
                      format: zto,pvalue
                    - name: cfi
                      title: CFI
                      type: number
                    - name: tli
                      title: TLI
                      type: number
                    - name: rmsea
                      title: RMSEA
                      type: number

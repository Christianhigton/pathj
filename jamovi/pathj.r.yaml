                    - name: line
                      title: Line
                      type: integer
                    - name: code
                      title: lavaan syntax
                      type: text

          - name: mermaidSyntax
            title: Mermaid Syntax
            type: Table
            visible: (showSyntax)
            columns:
                    - name: line
                      title: Line
                      type: integer
                    - name: code
                      title: Mermaid syntax
                      type: text


  - name: models

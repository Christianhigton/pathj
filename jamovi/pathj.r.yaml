          - name: pcurve
            title: P-Curve Screen
            type: Table
            columns:
                    - name: n_tests
                      title: Tests
                      type: integer
                    - name: n_significant
                      title: Significant
                      type: integer
                    - name: prop_p_lt_025
                      title: "p < .025"
                      type: number

          - name: lavaanSyntax
            title: lavaan Syntax
            type: Table
            visible: (showSyntax)

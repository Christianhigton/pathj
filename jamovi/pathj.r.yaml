                           title: 'Contrast'
                           type: text



  - name: pathgroup
    type: Group
    title: Path Model
    visible: (diagram)
    clearWith:
                  - endogenous
                  - cov_y
                  - constraints
                  - varcov
                  - data
                  - multigroup

    items:
           - name: diagrams
             title: Path Diagrams
             type: Array
             description: an array of path diagrams
             visible: (diagram)
             template:
                   title: $key
                   type: Image
                   renderFun: .showDiagram
                   width: 700
                   height: 500
                   clearWith:
                      - diag_resid
                      - diag_paths
                      - diag_sigstars
                      - diag_labsize
                      - diag_rotate
                      - diag_type
                      - diag_shape
                      - diag_abbrev
                      - diag_offset_labs
                      - showPathLegend
                      - showMermaidDiagramSyntax

                      - contrasts
                      - endogenousTerms
                      - cov_y
                      - constraints
                      - data
                      - multigroup
                      - varcov

             refs: semplot
             
           - name: legend
             type: Table
             title: Path Diagram Legend
             visible: (diagram && showPathLegend)
             columns:
                   - name: item
                     type: text
                     title: Item
                   - name: meaning
                     type: text
                     title: Meaning

           - name: notes
             type: Table
             title: ""
             visible: false
             columns:
                   - name: message
                     type: text
                     title: "Model diagram notes"

           - name: mermaidSyntax
             type: Table
             title: Mermaid Syntax for Path Diagram
             visible: (diagram && showMermaidDiagramSyntax)
             columns:
                   - name: line
                     type: integer
                     title: Line
                   - name: code
                     type: text
                     title: Mermaid syntax

  # P-value graphs
  - name: pgraphs
    type: Group
    title: P-Value Graphs
    visible: (pgraphs)
    clearWith:
                  - endogenous
                  - cov_y
                  - constraints
                  - varcov
                  - data
                  - multigroup
    items:
           - name: pcurves
             title: P-Value Curves
             type: Array
             visible: (pgraphs)
             template:
                title: $key
                type: Image
                renderFun: .plotPvalues
                width: 900
                height: 500
                clearWith:
                   - endogenous
                   - covs
                   - factors
                   - multigroup
                   - constraints

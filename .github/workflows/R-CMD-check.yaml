name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  R-CMD-check:
    runs-on: macos-latest
    env:
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::covr
            any::mice
            any::naniar
            any::lavaan.mi
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes")'

      - name: Coverage
        run: |
          Rscript -e 'coverage <- covr::package_coverage(); print(coverage); pct <- covr::percent_coverage(coverage); if (pct < 80) stop(sprintf("Test coverage %.2f%% is below the required 80%%", pct))'

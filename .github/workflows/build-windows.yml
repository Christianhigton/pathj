name: Build Windows jamovi module

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/windows-build-*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      JAMOVI_VERSION: "2.7.26.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rtools for R 4.5
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare a Windows build host matching jamovi's R ABI
        shell: pwsh
        run: |
          $rHome = (& Rscript -e 'cat(R.home())').Trim()
          $jamoviHome = Join-Path $env:RUNNER_TEMP 'pathj-build-host'
          New-Item -ItemType Directory -Force (Join-Path $jamoviHome 'Frameworks') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $jamoviHome 'bin') | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $jamoviHome 'Frameworks/R') -Target $rHome | Out-Null
          $rscript = (Get-Command Rscript.exe).Source
          Copy-Item $rscript (Join-Path $jamoviHome 'bin/jamovi.exe')
          $library = Join-Path $env:RUNNER_TEMP 'pathj-build-library'
          New-Item -ItemType Directory -Force $library | Out-Null
          "JAMOVI_HOME=$jamoviHome" >> $env:GITHUB_ENV
          "PATHJ_MATCHED_R=true" >> $env:GITHUB_ENV
          "R_HOME=$rHome" >> $env:GITHUB_ENV
          "PATHJ_RSCRIPT=$rscript" >> $env:GITHUB_ENV
          "R_LIBS_USER=$library" >> $env:GITHUB_ENV

      - name: Install build tools and matching runtime dependencies
        shell: pwsh
        run: |
          & $env:PATHJ_RSCRIPT -e 'install.packages(c("jmvtools", "remotes", "semPlot"), repos=c("https://repo.jamovi.org", "https://cloud.r-project.org"))'
          if ($LASTEXITCODE -ne 0) { throw 'Installing jmvtools failed' }

      - name: Build and verify Windows module
        shell: pwsh
        run: |
          & $env:PATHJ_RSCRIPT scripts/build_windows_jmo.R
          if ($LASTEXITCODE -ne 0) { throw 'Building PATHj failed' }

      - name: Smoke-test the packaged module
        shell: pwsh
        run: |
          $env:PATHJ_RUNTIME_LIBS = (Join-Path $env:JAMOVI_HOME 'Resources/modules/base/R') + ';' + (Join-Path $env:JAMOVI_HOME 'Resources/modules/jmv/R')
          $module = Get-ChildItem 'pathj_*_windows.jmo' | Select-Object -First 1
          & $env:PATHJ_RSCRIPT scripts/smoke_module.R $module.FullName
          if ($LASTEXITCODE -ne 0) { throw 'The packaged module failed its smoke test' }

      - name: Upload Windows module
        uses: actions/upload-artifact@v4
        with:
          name: pathj-windows
          path: pathj_*_windows.jmo
          if-no-files-found: error

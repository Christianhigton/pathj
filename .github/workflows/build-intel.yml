name: Build Intel jamovi module

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/intel-build-*"

jobs:
  build-intel:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Intel R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Install graphics runtime for PDF export checks
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install --cask xquartz

      - name: Install jmvtools
        run: |
          Rscript -e 'install.packages(c("jmvtools", "semPlot", "remotes"), repos=c("https://repo.jamovi.org", "https://cloud.r-project.org"))'

      - name: Build and verify Intel module
        run: Rscript scripts/build_intel_jmo.R

      - name: Smoke-test the packaged module
        run: |
          for module in pathj_*_intel.jmo; do
            Rscript scripts/smoke_module.R "$module"
          done

      - name: Upload Intel module
        uses: actions/upload-artifact@v4
        with:
          name: pathj-intel
          path: pathj_*_intel.jmo
          if-no-files-found: error
